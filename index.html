<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сервис Эскроу - Платформа Юридической Гарантии</title>
</head>
<body>
    <header>
        <h1>ГАРАНТ СЕРВИС</h1>
    </header>
    <main>
        <form>
            <label for="amount">Сумма (₽):</label>
            <input type="text" id="amount" placeholder="Введите сумму">
            <button type="submit">Отправить</button>
        </form>
        <p id="error-message" style="color:red; display:none;">Произошла ошибка. Пожалуйста, попробуйте еще раз.</p>
    </main>
</body>
</html>
