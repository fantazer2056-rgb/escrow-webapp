<form id="two-step-form">
    <div id="step-1">
        <h2>Шаг 1: Личные данные</h2>
        <label for="amount">Сумма:</label>
        <input type="text" id="amount" name="amount" required>
        
        <label for="description">Описание:</label>
        <input type="text" id="description" name="description" required>
        
        <label for="recipient">Получатель:</label>
        <input type="text" id="recipient" name="recipient" required>
        
        <button type="button" onclick="nextStep()">Далее</button>
    </div>
    
    <div id="step-2" style="display:none;">
        <h2>Шаг 2: Кошелек USDT</h2>
        <label for="usdt-wallet">Кошелек USDT:</label>
        <input type="text" id="usdt-wallet" name="usdt-wallet" required pattern="^0x[a-fA-F0-9]{40}$" title="Пожалуйста, введите допустимый адрес USDT в формате 0x...">
        
        <button type="submit">Отправить</button>
    </div>
</form>

<script>
function nextStep() {
    document.getElementById('step-1').style.display = 'none';
    document.getElementById('step-2').style.display = 'block';
}
</script>
